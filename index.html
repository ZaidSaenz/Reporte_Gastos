<!DOCTYPE html>
<html
  lang="es"
  data-visual-style="modern"
  data-palette="magenta"
>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#d10082"
  >

  <meta
    name="description"
    content="Private and customizable expense tracker."
  >

  <title>Expense Tracker</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="stylesheet"
    href="./css/palettes.css"
  >

  <link
    rel="stylesheet"
    href="./css/base.css"
  >

  <link
    rel="stylesheet"
    href="./css/components.css"
  >

  <link
    rel="stylesheet"
    href="./css/visual-styles.css"
  >
</head>

<body>
  <header class="app-header">
    <div class="app-shell app-header__content">
      <div>
        <p
          class="eyebrow"
          data-i18n="app.subtitle"
        >
          Registro privado en tu dispositivo
        </p>

        <h1 data-i18n="app.title">
          Control de gastos
        </h1>
      </div>

      <button
        id="open-settings-button"
        class="icon-button"
        type="button"
        data-i18n-aria-label="settings.open"
        aria-label="Abrir configuración"
      >
        ⚙
      </button>
    </div>
  </header>

  <main class="app-shell app-main">
    <section
      class="panel dashboard-panel"
      aria-labelledby="dashboard-title"
    >
      <div class="section-heading">
        <div>
          <p
            class="eyebrow"
            data-i18n="dashboard.subtitle"
          >
            Resumen de tus movimientos
          </p>

          <h2
            id="dashboard-title"
            data-i18n="dashboard.title"
          >
            Gasto acumulado
          </h2>
        </div>
      </div>

      <div
        id="expense-summary"
        class="expense-summary"
      ></div>
    </section>

    <section
      id="new-expense-panel"
      class="panel"
      aria-labelledby="new-expense-title"
    >
      <div class="section-heading">
        <div>
          <p
            class="eyebrow"
            data-i18n="expense.subtitle"
          >
            Registro rápido
          </p>

          <h2
            id="new-expense-title"
            data-i18n="expense.title"
          >
            Nuevo gasto
          </h2>
        </div>
      </div>

      <form
        id="expense-form"
        class="expense-form"
        novalidate
      >
        <div class="form-grid">
          <div class="field">
            <label
              for="expense-amount"
              data-i18n="expense.amount"
            >
              Importe
            </label>

            <div class="currency-input">
              <span aria-hidden="true">
                $
              </span>

              <input
                id="expense-amount"
                type="text"
                inputmode="decimal"
                autocomplete="off"
                placeholder="0.00"
              >
            </div>
          </div>

          <div class="field">
            <label
              for="expense-date"
              data-i18n="expense.date"
            >
              Fecha
            </label>

            <input
              id="expense-date"
              type="date"
            >
          </div>
        </div>

        <fieldset class="category-fieldset">
          <legend data-i18n="expense.category">
            Categoría
          </legend>

          <div
            id="category-selector"
            class="category-selector"
          ></div>
        </fieldset>

        <div
          id="custom-category-field"
          class="field is-hidden"
        >
          <label
            for="custom-category"
            data-i18n="expense.customCategory"
          >
            Nombre de la categoría
          </label>

          <input
            id="custom-category"
            type="text"
            autocomplete="off"
          >
        </div>

        <fieldset
          id="subcategory-section"
          class="category-fieldset is-hidden"
        >
          <legend data-i18n="expense.subcategory">
            Subcategoría
          </legend>

          <div
            id="subcategory-selector"
            class="subcategory-selector"
          ></div>
        </fieldset>

        <div
          id="custom-subcategory-field"
          class="field is-hidden"
        >
          <label
            for="custom-subcategory"
            data-i18n="expense.customSubcategory"
          >
            Especifica el tipo de gasto
          </label>

          <input
            id="custom-subcategory"
            type="text"
            autocomplete="off"
          >
        </div>

        <div class="field">
          <label
            for="expense-description"
            data-i18n="expense.description"
          >
            Descripción opcional
          </label>

          <input
            id="expense-description"
            type="text"
            autocomplete="off"
            data-i18n-placeholder="expense.descriptionPlaceholder"
            placeholder="Ej. Compra semanal"
          >
        </div>

        <div class="form-actions">
          <button
            id="save-expense-button"
            class="button button--primary"
            type="button"
            data-i18n="expense.save"
          >
            Guardar gasto
          </button>

          <button
            id="cancel-edit-button"
            class="button button--secondary is-hidden"
            type="button"
            data-i18n="expense.cancelEdit"
          >
            Cancelar edición
          </button>
        </div>

        <p
          id="app-message"
          class="app-message"
          aria-live="polite"
        ></p>
      </form>
    </section>

    <section
      id="recent-categories-panel"
      class="panel is-hidden"
      aria-labelledby="recent-categories-title"
    >
      <div class="section-heading">
        <div>
          <p
            class="eyebrow"
            data-i18n="recent.subtitle"
          >
            Acceso rápido
          </p>

          <h2
            id="recent-categories-title"
            data-i18n="recent.title"
          >
            Categorías recientes
          </h2>
        </div>
      </div>

      <p
        class="helper-text"
        data-i18n="recent.help"
      >
        Toca una categoría para usarla en el formulario.
      </p>

      <div
        id="recent-categories"
        class="recent-categories"
      ></div>
    </section>

    <section
      class="panel"
      aria-labelledby="expense-history-title"
    >
      <div class="section-heading">
        <div>
          <p
            class="eyebrow"
            data-i18n="history.subtitle"
          >
            Movimientos por día
          </p>

          <h2
            id="expense-history-title"
            data-i18n="history.title"
          >
            Historial de gastos
          </h2>
        </div>
      </div>

      <div
        id="expense-history"
        class="expense-history"
      ></div>
    </section>
  </main>

  <dialog
    id="settings-dialog"
    class="settings-dialog"
  >
    <div class="dialog-header">
      <h2 data-i18n="settings.title">
        Configuración
      </h2>

      <button
        id="close-settings-button"
        class="icon-button"
        type="button"
        data-i18n-aria-label="settings.close"
        aria-label="Cerrar configuración"
      >
        ×
      </button>
    </div>

    <div class="settings-grid">
      <div class="field">
        <label
          for="select-language"
          data-i18n="settings.language"
        >
          Idioma
        </label>

        <select id="select-language">
          <option value="es">
            Español
          </option>

          <option value="en">
            English
          </option>
        </select>
      </div>

      <div class="field">
        <label
          for="select-visual-style"
          data-i18n="settings.visualStyle"
        >
          Estilo visual
        </label>

        <select id="select-visual-style">
          <option
            value="modern"
            data-i18n="settings.modern"
          >
            Moderno
          </option>

          <option
            value="pixel"
            data-i18n="settings.pixel"
          >
            Pixel art
          </option>

          <option
            value="office"
            data-i18n="settings.office"
          >
            Oficina
          </option>
        </select>
      </div>

      <div class="field">
        <label
          for="select-palette"
          data-i18n="settings.palette"
        >
          Paleta de colores
        </label>

        <select id="select-palette">
          <option value="magenta" data-i18n="palettes.magenta">
            Magenta
          </option>
          <option value="ocean" data-i18n="palettes.ocean">
            Océano
          </option>
          <option value="emerald" data-i18n="palettes.emerald">
            Esmeralda
          </option>
          <option value="violet" data-i18n="palettes.violet">
            Violeta
          </option>
          <option value="amber" data-i18n="palettes.amber">
            Ámbar
          </option>
          <option value="powder" data-i18n="palettes.powder">
            Azul pastel
          </option>
          <option value="sage" data-i18n="palettes.sage">
            Verde salvia
          </option>
          <option value="warmGray" data-i18n="palettes.warmGray">
            Gris cálido
          </option>
        </select>
      </div>

      <div class="field">
        <label
          for="select-currency"
          data-i18n="settings.currency"
        >
          Moneda
        </label>

        <select id="select-currency">
          <option value="MXN">MXN</option>
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
        </select>
      </div>
    </div>

    <div class="settings-actions">
      <button
        id="export-backup-button"
        class="button button--secondary"
        type="button"
        data-i18n="settings.export"
      >
        Exportar respaldo
      </button>

      <button
        id="import-backup-button"
        class="button button--secondary"
        type="button"
        data-i18n="settings.import"
      >
        Importar respaldo
      </button>

      <button
        id="clear-data-button"
        class="button button--danger"
        type="button"
        data-i18n="settings.clear"
      >
        Borrar todos los datos
      </button>
    </div>

    <input
      id="backup-file-input"
      class="is-hidden"
      type="file"
      accept="application/json,.json"
    >
  </dialog>

  <script
    src="./js/categories.js"
    defer
  ></script>

  <script
    src="./js/storage.js"
    defer
  ></script>

  <script
    src="./js/i18n.js"
    defer
  ></script>

  <script
    src="./js/settings.js"
    defer
  ></script>

  <script
    src="./js/history.js"
    defer
  ></script>

  <script
    src="./js/copy-history.js"
    defer
  ></script>

  <script
    src="./js/app.js"
    defer
  ></script>
</body>
</html>

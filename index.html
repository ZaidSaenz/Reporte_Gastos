<!DOCTYPE html>
<html
  lang="es"
  data-theme="default"
>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#222522"
  >

  <meta
    name="description"
    content="Private and customizable expense tracker."
  >

  <title>Expense Tracker</title>

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="stylesheet"
    href="./css/base.css"
  >

  <link
    rel="stylesheet"
    href="./css/components.css"
  >

  <link
    rel="stylesheet"
    href="./css/themes.css"
  >
</head>

<body>

  <header class="app-header">
    <div class="app-shell app-header__content">
      <h1
        class="visually-hidden"
        data-i18n="app.title"
      >
        Control de gastos
      </h1>

      <button
        id="open-settings-button"
        class="icon-button"
        type="button"
        data-i18n-aria-label="settings.open"
        aria-label="Abrir configuración"
      >
        ⚙
      </button>
    </div>
  </header>

  <main class="app-shell app-main">
    <!-- First screen -->
    <section class="home-hero">

      <!-- Current spending card -->
      <section
        class="home-card"
        aria-labelledby="current-spending-label"
      >
        <div class="home-card__summary">
          <p
            id="current-spending-label"
            class="home-card__label"
            data-i18n="dashboard.currentSpending"
          >
            Gasto actual
          </p>

          <strong
            id="current-spending-value"
            class="home-card__amount"
          >
            $0.00
          </strong>

          <div
            id="remaining-budget-block"
            class="home-card__budget is-hidden"
          >
            <span data-i18n="dashboard.remainingBudget">
              Presupuesto restante
            </span>

            <strong id="remaining-budget-value">
              $0.00
            </strong>
          </div>
        </div>
      </section>

      <!-- Main action -->
      <div class="add-expense-section">
        <button
          id="open-expense-button"
          class="add-expense-button"
          type="button"
          data-i18n-aria-label="expense.open"
          aria-label="Agregar gasto"
        >
          <span
            id="add-expense-icon-fallback"
            class="add-expense-button__fallback"
            aria-hidden="true"
          >
            +
          </span>

          <img
            id="add-expense-icon"
            class="add-expense-button__image is-hidden"
            src=""
            alt=""
          >
        </button>
      </div>

      <!-- App messages -->
      <p
        id="app-message"
        class="app-message"
        aria-live="polite"
      ></p>
    </section>

    <!-- History card -->
    <section
      class="history-section"
      aria-labelledby="history-section-title"
    >
      <button
        id="open-history-button"
        class="history-launcher history-card"
        type="button"
      >
        <span class="history-card__content">
          <strong
            id="history-section-title"
            class="history-card__title"
            data-i18n="history.title"
          >
            Historial de gastos
          </strong>

          <span class="history-card__hint">
            Ver movimientos anteriores
          </span>
        </span>

        <span
          class="history-card__arrow"
          aria-hidden="true"
        >
          ›
        </span>
      </button>
    </section>
  </main>

  <!-- Add or edit expense -->
  <dialog
    id="expense-dialog"
    class="app-dialog expense-dialog"
  >
    <div class="dialog-header">
      <div>
        <p
          class="eyebrow"
          data-i18n="expense.subtitle"
        >
          Registro rápido
        </p>

        <h2
          id="expense-dialog-title"
          data-i18n="expense.title"
        >
          Nuevo gasto
        </h2>
      </div>

      <button
        id="close-expense-button"
        class="icon-button"
        type="button"
        data-i18n-aria-label="general.close"
        aria-label="Cerrar"
      >
        ×
      </button>
    </div>

    <form
      id="expense-form"
      class="expense-form"
      novalidate
    >
      <div class="field field--amount">
        <label
          for="expense-amount"
          data-i18n="expense.amount"
        >
          Importe
        </label>

        <div class="currency-input currency-input--large">
          <span aria-hidden="true">$</span>

          <input
            id="expense-amount"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            placeholder="0.00"
          >
        </div>
      </div>

      <fieldset class="category-fieldset">
        <legend data-i18n="expense.category">
          Categoría
        </legend>

        <div
          id="category-selector"
          class="category-selector"
        ></div>
      </fieldset>

      <div
        id="custom-category-field"
        class="field is-hidden"
      >
        <label
          for="custom-category"
          data-i18n="expense.customCategory"
        >
          Nombre de la categoría
        </label>

        <input
          id="custom-category"
          type="text"
          autocomplete="off"
        >
      </div>

      <details class="expense-more-details">
        <summary data-i18n="expense.moreDetails">
          Más detalles
        </summary>

        <div class="expense-more-details__content">
          <fieldset
            id="subcategory-section"
            class="category-fieldset is-hidden"
          >
            <legend data-i18n="expense.subcategory">
              Subcategoría
            </legend>

            <div
              id="subcategory-selector"
              class="subcategory-selector"
            ></div>
          </fieldset>

          <div
            id="custom-subcategory-field"
            class="field is-hidden"
          >
            <label
              for="custom-subcategory"
              data-i18n="expense.customSubcategory"
            >
              Especifica el tipo de gasto
            </label>

            <input
              id="custom-subcategory"
              type="text"
              autocomplete="off"
            >
          </div>

          <div class="field">
            <label
              for="expense-description"
              data-i18n="expense.description"
            >
              Descripción opcional
            </label>

            <input
              id="expense-description"
              type="text"
              autocomplete="off"
              data-i18n-placeholder="expense.descriptionPlaceholder"
              placeholder="Ej. Compra semanal"
            >
          </div>

          <div class="field">
            <label
              for="expense-date"
              data-i18n="expense.date"
            >
              Fecha
            </label>

            <input
              id="expense-date"
              type="date"
            >
          </div>
        </div>
      </details>

      <div class="form-actions">
        <button
          id="save-expense-button"
          class="button button--primary"
          type="button"
          data-i18n="expense.save"
        >
          Guardar gasto
        </button>

        <button
          id="cancel-edit-button"
          class="button button--secondary is-hidden"
          type="button"
          data-i18n="expense.cancelEdit"
        >
          Cancelar edición
        </button>
      </div>
    </form>
  </dialog>

  <!-- History overlay -->
  <dialog
    id="history-dialog"
    class="history-overlay"
  >
    <div class="overlay-header">
      <button
        id="close-history-button"
        class="icon-button"
        type="button"
        data-i18n-aria-label="history.close"
        aria-label="Cerrar historial"
      >
        ‹
      </button>

      <h2 data-i18n="history.title">
        Historial de gastos
      </h2>

      <span
        class="overlay-header__spacer"
        aria-hidden="true"
      ></span>
    </div>

    <div
      id="expense-history"
      class="expense-history"
    ></div>
  </dialog>

  <!-- Expense details -->
  <dialog
    id="expense-details-dialog"
    class="app-dialog details-dialog"
  >
    <div class="dialog-header">
      <h2 data-i18n="history.detailsTitle">
        Detalles del gasto
      </h2>

      <button
        id="close-expense-details-button"
        class="icon-button"
        type="button"
        data-i18n-aria-label="general.close"
        aria-label="Cerrar"
      >
        ×
      </button>
    </div>

    <dl class="expense-details-list">
      <div>
        <dt data-i18n="expense.amount">
          Importe
        </dt>

        <dd id="details-amount">
          $0.00
        </dd>
      </div>

      <div>
        <dt data-i18n="expense.category">
          Categoría
        </dt>

        <dd id="details-category">
          —
        </dd>
      </div>

      <div>
        <dt data-i18n="expense.date">
          Fecha
        </dt>

        <dd id="details-date">
          —
        </dd>
      </div>

      <div>
        <dt data-i18n="expense.description">
          Descripción
        </dt>

        <dd id="details-description">
          —
        </dd>
      </div>
    </dl>

    <div class="details-actions">
      <button
        id="edit-expense-detail-button"
        class="button button--secondary"
        type="button"
        data-i18n="history.edit"
      >
        Editar
      </button>

      <button
        id="delete-expense-detail-button"
        class="button button--danger"
        type="button"
        data-i18n="history.delete"
      >
        Eliminar
      </button>
    </div>
  </dialog>

  <!-- Settings -->
  <dialog
    id="settings-dialog"
    class="app-dialog settings-dialog"
  >
    <div class="dialog-header">
      <h2 data-i18n="settings.title">
        Configuración
      </h2>

      <button
        id="close-settings-button"
        class="icon-button"
        type="button"
        data-i18n-aria-label="settings.close"
        aria-label="Cerrar configuración"
      >
        ×
      </button>
    </div>

    <div class="settings-grid">
      <div class="field">
        <label
          for="select-language"
          data-i18n="settings.language"
        >
          Idioma
        </label>

        <select id="select-language">
          <option value="es">
            Español
          </option>

          <option value="en">
            English
          </option>
        </select>
      </div>

      <div class="field">
        <label
          for="select-visual-style"
          data-i18n="settings.visualStyle"
        >
          Tema visual
        </label>

        <select id="select-visual-style">
          <option value="default">
            Predeterminado
          </option>

          <option
            value="matte"
            data-i18n="settings.matte"
          >
            Mate cómodo
          </option>

          <option
            value="pixel-art"
            data-i18n="settings.pixelArt"
          >
            Pixel art
          </option>

          <option
            value="cyberpunk"
            data-i18n="settings.cyberpunk"
          >
            Cyberpunk
          </option>
        </select>
      </div>

      <div class="field">
        <label
          for="select-currency"
          data-i18n="settings.currency"
        >
          Moneda
        </label>

        <select id="select-currency">
          <option value="MXN">
            MXN
          </option>

          <option value="USD">
            USD
          </option>

          <option value="EUR">
            EUR
          </option>
        </select>
      </div>

      <div class="field">
        <label
          for="monthly-budget-input"
          data-i18n="settings.monthlyBudget"
        >
          Presupuesto mensual
        </label>

        <input
          id="monthly-budget-input"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          placeholder="0.00"
        >

        <p
          class="field-help"
          data-i18n="settings.monthlyBudgetHelp"
        >
          Déjalo vacío para ocultarlo.
        </p>
      </div>

      <div class="field">
        <label
          for="select-add-button-icon"
          data-i18n="settings.addButtonIcon"
        >
          Icono del botón
        </label>

        <select id="select-add-button-icon"></select>
      </div>
    </div>

    <div class="settings-actions">
      <button
        id="export-backup-button"
        class="button button--secondary"
        type="button"
        data-i18n="settings.export"
      >
        Exportar respaldo
      </button>

      <button
        id="import-backup-button"
        class="button button--secondary"
        type="button"
        data-i18n="settings.import"
      >
        Importar respaldo
      </button>

      <button
        id="clear-data-button"
        class="button button--danger"
        type="button"
        data-i18n="settings.clear"
      >
        Borrar todos los datos
      </button>
    </div>

    <input
      id="backup-file-input"
      class="is-hidden"
      type="file"
      accept="application/json,.json"
    >
  </dialog>

  <script
    src="./js/categories.js"
    defer
  ></script>

  <script
    src="./js/storage.js"
    defer
  ></script>

  <script
    src="./js/i18n.js"
    defer
  ></script>

  <script
    src="./js/settings.js"
    defer
  ></script>

  <script
    src="./js/history.js"
    defer
  ></script>

  <script
    src="./js/copy-history.js"
    defer
  ></script>

  <script
    src="./js/app.js"
    defer
  ></script>
</body>
</html>
